[project]
name = "garmin-mcp-login"
version = "0.2.0"
description = "One-time Garmin Connect login that saves tokens for the garmin-mcp Cloudflare Worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
]

[project.scripts]
garmin-mcp-login = "garmin_mcp_login:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp_login"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
